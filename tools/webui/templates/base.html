<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EDA-GP 实验看板{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">EDA-GP 实验看板</a>
  <nav>
    <a href="{{ url_for('index') }}" {% if request.path == '/' %}class="active"{% endif %}>实验总览</a>
    <a href="{{ url_for('docs') }}" {% if request.path.startswith('/docs') %}class="active"{% endif %}>分析文档</a>
  </nav>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="footer">DREAMPlace 全局布局初始化研究 · 数据实时读取自 <code>experiments/</code></footer>
<script src="{{ url_for('static', filename='vendor/marked/marked.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/katex/katex.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/katex/auto-render.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/chartjs/chart.umd.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
